# Free Supabase projects pause after 7 days without activity.
# This pings the database every 3 days so the Wubber pilot never goes to sleep.
name: Keep Supabase awake
on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the database a tiny question
        run: |
          KEY=$(grep -o 'supabaseAnonKey: "[^"]*"' <(curl -fsS https://wubber-pi.vercel.app/config.js) | cut -d'"' -f2)
          URL="https://qcrlmxrvmmvccwutztzn.supabase.co"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/rest/v1/rpc/shared_trip" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -d '{"p_token":"00000000-0000-0000-0000-000000000000"}')
          echo "Supabase answered $code"
          test "$code" = "200"
