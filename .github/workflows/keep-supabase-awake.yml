# Free Supabase projects pause after 7 days without activity.
# Every hour this visits the Wubber website like a person would (home, trip and
# privacy pages), then talks to the database and the login service,
# so the pilot never goes to sleep. If the database doesn't answer, the run fails
# and GitHub emails the repository owner.
name: Keep Supabase awake
on:
  schedule:
    - cron: "23 * * * *"   # every hour at :23 (GitHub can start runs late, so hourly leaves plenty of margin)
  workflow_dispatch:
concurrency:
  group: keep-awake
  cancel-in-progress: true
jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE: https://wubber-pi.vercel.app
      SUPABASE: https://qcrlmxrvmmvccwutztzn.supabase.co
      UA: "Mozilla/5.0 (compatible; WubberKeepAwake/1.0)"
    steps:
      - name: Visit the website
        run: |
          for page in / /trip.html /privacy.html /config.js /app.js; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -A "$UA" --retry 3 --retry-delay 10 "$SITE$page")
            echo "Website $page answered $code"
          done

      - name: Talk to the database
        run: |
          # The public (anon) key is read from the live site, so it stays right if it ever changes.
          KEY=$(curl -fsS -A "$UA" --retry 3 "$SITE/config.js" | grep -o 'supabaseAnonKey: "[^"]*"' | cut -d'"' -f2)
          test -n "$KEY" || { echo "Couldn't read the public key from $SITE/config.js"; exit 1; }
          H=(-H "apikey: $KEY" -H "Authorization: Bearer $KEY" -A "$UA")

          # 1. Run a database function (the one shared-trip links use) with a token that matches nothing.
          ok=""
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$SUPABASE/rest/v1/rpc/shared_trip" "${H[@]}" \
              -H "Content-Type: application/json" -d '{"p_token":"00000000-0000-0000-0000-000000000000"}')
            echo "Database function answered $code (attempt $attempt)"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 20
          done

          # 2. Ask the login service for its settings.
          echo "Login service answered $(curl -s -o /dev/null -w "%{http_code}" "$SUPABASE/auth/v1/settings" "${H[@]}")"

          test -n "$ok" || { echo "The database did not answer. Check the project in the Supabase dashboard."; exit 1; }
